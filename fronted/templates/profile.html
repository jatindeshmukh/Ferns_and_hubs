{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile | FernsHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f3f4f6 0%, #e3f2e1 100%);
      font-family: Arial, sans-serif;
    }
    .profile-container {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .profile-header {
      text-align: center;
      color: #28a745;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .profile-detail {
      font-size: 18px;
      margin: 10px 0;
      color: #333;
    }
    .btn-logout {
      display: block;
      margin-top: 30px;
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }
    .btn-logout:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <h2 class="profile-header">Welcome, {{ username }}</h2>
    <div class="profile-detail"><strong>Username:</strong> {{ username }}</div>
    <div class="profile-detail"><strong>Email:</strong> {{ email }}</div>
    <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
  </div>
</body>
</html>
