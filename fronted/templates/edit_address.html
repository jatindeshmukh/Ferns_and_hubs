{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Address</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" name="full_name" class="form-control" required maxlength="100" value="{{ address.full_name }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number *</label>
                            <input type="text" name="phone" class="form-control" required maxlength="15" value="{{ address.phone }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address Line *</label>
                            <textarea name="address_line" class="form-control" required maxlength="255" rows="2">{{ address.address_line }}</textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City *</label>
                                <input type="text" name="city" class="form-control" required maxlength="100" value="{{ address.city }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">State *</label>
                                <input type="text" name="state" class="form-control" required maxlength="100" value="{{ address.state }}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Postal Code *</label>
                                <input type="text" name="postal_code" class="form-control" required maxlength="10" value="{{ address.postal_code }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Country *</label>
                                <input type="text" name="country" class="form-control" required maxlength="100" value="{{ address.country }}">
                            </div>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="is_default" id="is_default" {% if address.is_default %}checked{% endif %}>
                            <label class="form-check-label" for="is_default">
                                Set as default address
                            </label>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'manage_addresses' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Back
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-1"></i> Update Address
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
