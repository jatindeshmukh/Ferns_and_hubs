{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="container my-5">
  <h2 class="text-center mb-4 fw-bold text-success">🌿 All Products</h2>
  
  <div class="row g-4">
    {% for product in products %}
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm border-0">
          <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text text-muted">{{ product.description|truncatechars:60 }}</p>
            <p class="fw-bold text-success">₹{{ product.price }}</p>
            <a href="{% url 'product_detail' product.id %}" class="btn btn-outline-success w-100">View Details</a>
          </div>
        </div>
      </div>
    {% empty %}
      <p class="text-center">No products available yet.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
