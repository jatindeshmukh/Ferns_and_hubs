{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - FernsHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4 text-center">
                        <h2 class="text-success mb-4">Complete Your Payment</h2>
                        <p class="text-muted mb-4">Order #{{ order.id }} - ₹{{ amount }}</p>
                        
                        <button id="pay-button" class="btn btn-success btn-lg w-100">
                            Pay ₹{{ amount }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var options = {
            "key": "{{ razorpay_key_id }}",
            "amount": "{{ amount|floatformat:0 }}00", // Amount in paise
            "currency": "INR",
            "name": "FernsHub",
            "description": "Order #{{ order.id }}",
            "order_id": "{{ razorpay_order_id }}",
            "handler": function (response){
                // Redirect to success page
                window.location.href = "{% url 'order_confirmation' order.id %}";
            },
            "prefill": {
                "name": "{{ user.username }}",
                "email": "{{ user.email }}"
            },
            "theme": {
                "color": "#198754"
            }
        };
        
        var rzp1 = new Razorpay(options);
        
        document.getElementById('pay-button').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
        
        // Auto-open payment modal
        rzp1.open();
    </script>
</body>
</html>
