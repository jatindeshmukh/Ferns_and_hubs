{% load static %}

{% block content %}
<style>
  body {
    background-color: #f3f4f6;
    margin: 0;
    font-family: "Poppins", sans-serif;
  }

  .forgot-section {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .forgot-container {
    background: #ffffff;
    padding: 40px 35px;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 400px;
    text-align: center;
    animation: fadeIn 0.8s ease;
  }

  .forgot-logo {
    width: 100px;
    margin-bottom: 15px;
  }

  .forgot-container h2 {
    color: #2e7d32; /* Fern Green */
    font-weight: 600;
    margin-bottom: 25px;
    font-size: 22px;
  }

  .forgot-container form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .forgot-container label {
    text-align: left;
    color: #388E3C;
    margin-bottom: 5px;
    font-weight: 500;
    font-size: 15px;
  }

  .forgot-container input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #C8E6C9;
    border-radius: 8px;
    font-size: 15px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .forgot-container input[type="email"]:focus {
    outline: none;
    border-color: #66BB6A;
    box-shadow: 0 0 6px rgba(102, 187, 106, 0.4);
  }

  .forgot-container button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #43A047, #66BB6A);
    border: none;
    color: #fff;
    font-size: 17px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s ease, background 0.3s ease;
  }

  .forgot-container button:hover {
    transform: scale(1.03);
    background: linear-gradient(135deg, #388E3C, #4CAF50);
  }

  .forgot-container p {
    margin-top: 20px;
    color: #444;
    font-size: 15px;
  }

  .forgot-container a {
    color: #2e7d32;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
  }

  .forgot-container a:hover {
    text-decoration: underline;
  }

  .message {
    background: #E8F5E9;
    color: #2E7D32;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 14px;
    border: 1px solid #A5D6A7;
    text-align: center;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Responsive Design */
  @media (max-width: 480px) {
    .forgot-container {
      padding: 30px 25px;
      max-width: 90%;
    }

    .forgot-container h2 {
      font-size: 20px;
    }

    .forgot-container button {
      font-size: 16px;
      padding: 10px;
    }
  }
</style>

<div class="forgot-section">
  <div class="forgot-container">
    <img src="{% static 'images/Fernshub Logo.png' %}" alt="FernsHub Logo" class="forgot-logo">
    <h2>Forgot Password</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
      <button type="submit">Send Reset Link</button>
    </form>

    <p><a href="{% url 'login' %}">← Back to Login</a></p>
  </div>
</div>
{% endblock %}
