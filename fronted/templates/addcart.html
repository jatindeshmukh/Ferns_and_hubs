{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Ferns 'N Herbs</title>
  <link rel="stylesheet" href="{% static 'css/addcart.css' %}"">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="cart-container">
    <h1>Your Shopping Cart</h1>
    <table class="cart-table">
      <thead>
        <tr>
          <th style="width: 50%;">Product</th>
          <th style="width: 15%;">Price</th>
          <th style="width: 15%;">Quantity</th>
          <th style="width: 15%;">Total</th>
          <th style="width: 5%;"></th>
        </tr>
      </thead>
      <tbody id="cart-body">
        <!-- Sample Product 1 -->
        <tr>
          <td>
            <div class="product-details">
              <img src="https://pngimg.com/uploads/aloe_vera/aloe_vera_PNG26.png" alt="Aloe Vera">
              <div class="product-info">
                <h3>Aloe Vera</h3>
                <p>Indoor Plant</p>
              </div>
            </div>
          </td>
          <td class="price" data-price="249">₹249</td>
          <td>
            <div class="quantity-selector">
              <input type="number" class="qty" value="1" min="1">
            </div>
          </td>
          <td class="item-total">₹249</td>
          <td class="remove-item"><a href="#"><i class="fas fa-trash"></i></a></td>
        </tr>
        <!-- Sample Product 2 -->
        <tr>
          <td>
            <div class="product-details">
              <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6" alt="Money Plant">
              <div class="product-info">
                <h3>Money Plant</h3>
                <p>With Hanging Pot</p>
              </div>
            </div>
          </td>
          <td class="price" data-price="299">₹299</td>
          <td>
            <div class="quantity-selector">
              <input type="number" class="qty" value="1" min="1">
            </div>
          </td>
          <td class="item-total">₹299</td>
          <td class="remove-item"><a href="#"><i class="fas fa-trash"></i></a></td>
        </tr>
      </tbody>
    </table>

    <div class="cart-summary">
      <p>Subtotal: <span id="subtotal">₹0</span></p>
      <p>Shipping: <span id="shipping">₹50</span></p>
      <h2>Total: <span id="total">₹0</span></h2>
    </div>

    <div class="cart-actions">
      <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
      <a href="https://razorpay.me/@nikhildeoraojogi" class="btn btn-primary">Proceed to Payment <i class="fas fa-arrow-right"></i></a>
    </div>
  </div>

  <script>
    function updateCart() {
      let rows = document.querySelectorAll("#cart-body tr");
      let subtotal = 0;

      rows.forEach(row => {
        let price = parseInt(row.querySelector(".price").dataset.price);
        let qty = parseInt(row.querySelector(".qty").value);
        let total = price * qty;
        row.querySelector(".item-total").textContent = "₹" + total;
        subtotal += total;
      });

      document.getElementById("subtotal").textContent = "₹" + subtotal;
      let shipping = subtotal > 0 ? 50 : 0;
      document.getElementById("shipping").textContent = "₹" + shipping;
      document.getElementById("total").textContent = "₹" + (subtotal + shipping);
    }

    // Quantity change
    document.querySelectorAll(".qty").forEach(input => {
      input.addEventListener("input", updateCart);
    });

    // Remove item
    document.querySelectorAll(".remove-item a").forEach((btn, index) => {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        this.closest("tr").remove();
        updateCart();
      });
    });

    // Initial calculation
    updateCart();
  </script>
</body>
</html>
