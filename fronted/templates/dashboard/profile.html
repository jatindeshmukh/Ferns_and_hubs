<!-- Profile Section -->
<section id="profile" class="tab-content">
    <h2 class="section-title">My Profile</h2>
    <div class="card">
        <div class="card-body">
            <form method="POST" action="{% url 'update_profile' %}" class="profile-form">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="username" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                        </div>
                    </div>
                </div>
                <div class="form-group mb-3">
                    <label for="contact" class="form-label">Contact Number</label>
                    <input type="tel" class="form-control" id="contact" name="contact" value="{{ user.contact|default:'' }}" placeholder="Enter your contact number">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-success btn-lg">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</section>
