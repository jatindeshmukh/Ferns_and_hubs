<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; background: #f6f6f6; padding: 20px; }
.container {
    background: white; padding: 20px; border-radius: 10px;
    border: 1px solid #ddd; max-width: 600px; margin: auto;
}
.title {
    font-size: 20px; font-weight: bold; color: #198754; margin-bottom: 10px;
}
p { font-size: 14px; }
strong { color: #333; }
.footer { font-size: 12px; color: gray; border-top: 1px solid #ddd; padding-top: 10px; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
    <div class="title">New Contact Form Message</div>

    <p><strong>Name:</strong> {{ name }}</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Subject:</strong> {{ subject }}</p>

    <p><strong>Message:</strong></p>
    <p>{{ message }}</p>

    <div class="footer">
        FernsHub Contact Form • Received via Website
    </div>
</div>

</body>
</html>
